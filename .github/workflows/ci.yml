# CI: installs, checks, builds, and smoke tests the app on Windows (and on macOS for a manual run or a release tag, A1290), uploads screenshots and the Playwright report, and on a push to main (or a manual run) also builds the unsigned installers.
name: ci

on:
  # Push to main runs again now that the Windows unit tests pass (A1021, closing A80).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this one so installers are only built from a commit that passed every check.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows only on push and pull request; macOS joins for a manual run or a release tag, so a missing macOS runner never fails main (A1290).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash on Windows, so every step runs the same command on both runners.
        shell: bash
    env:
      # Where `install.js` keeps the Electron download, so the cache step below can restore it.
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # npm 11 skips install scripts (A19), so Electron's binary is not in node_modules yet; fetch it now instead of inside the first test.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Content verifier
        run: npx tsx tools/verify-content.ts

      - name: Build
        run: npm run build

      # The hosted Windows desktop is 1024x768, below the window's 1100x700 minimum; raise it so the window fits the screen.
      # Unverified on the windows-2025 image until the first real run. If the cmdlet is missing, the smoke test still passes
      # because it accepts the minimum size as the floor, so a failure here does not fail the job (A117).
      - name: Raise the Windows display resolution
        if: ${{ runner.os == 'Windows' }}
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance -ClassName Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      # windows-latest and macos-latest have a desktop session, so Electron opens a real window with no virtual display.
      - name: End-to-end tests
        run: npm run test:e2e

      # The e2e tests save screenshots under test-results/ (SAVE_PROOF is never set here, so docs/iterations/ is not touched).
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

  # Unsigned installers from a commit whose tests passed, kept as workflow artifacts only. Never a GitHub Release: publishing waits for Mohammad (M5.3).
  # Pull requests skip it to keep their run short. A tag run calls this workflow too, but release.yml builds the installers for tags, so `ref_type` keeps the two apart.
  package:
    name: package (${{ matrix.os }})
    needs: test
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch' }}
    strategy:
      fail-fast: false
      matrix:
        # Same platforms as the test job (A1290).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Unsigned until Mohammad buys certificates (docs/systems/packaging.md, "Later").
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder keeps its tool downloads (the nsis tools) here, so the cache step below can restore them.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Cache the electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The second and third paths are where electron-builder's own downloader keeps the Electron builds it packages (Windows and macOS); a path that does not exist on a runner is skipped.
          path: |
            .cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/Library/Caches/electron
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # `npm run package` is `electron-vite build && electron-builder --publish never`; targets and architectures come from the `build` config in package.json.
      - name: Package installers
        run: npm run package

      # The installer is only as good as the resources inside it. Check each unpacked build (one on Windows, arm64 and x64 on macOS) for the folders the app reads at run time.
      - name: Check the bundled resources
        run: |
          found=0
          for resources in dist/win-unpacked/resources dist/mac*/"Unreal Dojo.app/Contents/Resources"; do
            if [ -d "$resources" ]; then
              found=$((found + 1))
              for folder in content resources solutions licenses/fonts; do
                if [ ! -d "$resources/$folder" ]; then
                  echo "::error::$resources has no $folder folder"
                  exit 1
                fi
              done
              echo "$resources: content, resources, solutions, and licenses/fonts are present"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no unpacked build found under dist/"
            exit 1
          fi

      - name: List the installers
        run: ls -lh dist | grep -E '\.(exe|dmg)$'

      # Short retention: these are for trying a build, not for keeping. The files are already compressed, so zipping is off.
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
